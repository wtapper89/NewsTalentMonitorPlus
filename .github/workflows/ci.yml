name: Test

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript
        run: |
          node --check app/static/app.js
          node --check app/static/config.js
          node --check app/static/display.js
          node --check app/static/reload-on-update.js
          node --check app/static/room-sign.js
